<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to index.html while preserving the path
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      const repo = '/'
      const route = path.startsWith(repo)
        ? path.slice(repo.length)
        : path;
      
      window.location.replace(
        `/?redirect=${encodeURIComponent(route + search + hash)}`
      );
    </script>
  </head>
  <body>
    <p>Redirecting.</p>
  </body>
</html>
